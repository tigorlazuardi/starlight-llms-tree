name: Package compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pair: lowest
            astro: '7.0.2'
            starlight: '0.41.6'
          - pair: latest-compatible
            astro: '>=7.0.2 <8'
            starlight: '>=0.41.6 <0.42'
    name: Node 22.12 / ${{ matrix.pair }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Install compatibility pair
        run: npm install --no-save --package-lock=false "astro@$ASTRO_VERSION" "@astrojs/starlight@$STARLIGHT_VERSION"
        env:
          ASTRO_VERSION: ${{ matrix.astro }}
          STARLIGHT_VERSION: ${{ matrix.starlight }}
      - run: npm test
        env:
          ASTRO_VERSION: ${{ matrix.astro }}
          STARLIGHT_VERSION: ${{ matrix.starlight }}
